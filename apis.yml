name: Amazon Secrets Manager
description: >-
  Amazon Secrets Manager helps you manage, retrieve, and rotate database credentials,
  API keys, and other secrets throughout their lifecycle. It provides centralized
  secrets management with built-in integration for Amazon RDS, Amazon Redshift, and
  Amazon DocumentDB, enabling automatic rotation of secrets without requiring application
  changes.
url: https://aws.amazon.com/secrets-manager/
baseURL: https://secretsmanager.amazonaws.com

