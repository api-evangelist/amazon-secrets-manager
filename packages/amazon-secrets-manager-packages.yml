    url: https://pkg.go.dev/github.com/aws/aws-sdk-go-v2/service/secretsmanager
    install: go get github.com/aws/aws-sdk-go-v2/service/secretsmanager
    official: true
    verified_status: 200
  - language: ruby
    registry: rubygems
    name: aws-sdk-secretsmanager
    url: https://rubygems.org/gems/aws-sdk-secretsmanager
    install: gem install aws-sdk-secretsmanager
    official: true
    verified_status: 200
  - language: php
    registry: packagist
    name: aws/aws-sdk-php
    url: https://packagist.org/packages/aws/aws-sdk-php
