    registry: maven-central
    name: software.amazon.awssdk:secretsmanager
    url: https://central.sonatype.com/artifact/software.amazon.awssdk/secretsmanager
    install: "implementation 'software.amazon.awssdk:secretsmanager'"
    official: true
    verified_status: 200
