source: >-
  First-party AWS SDK client libraries for Amazon Secrets Manager, verified live
  against each package registry (HTTP 200). AWS ships one Secrets Manager client
  per language SDK; boto3/botocore and the aws-sdk-php monolith bundle every
  service including Secrets Manager.
packages:
  - language: javascript
    registry: npm
    name: "@aws-sdk/client-secrets-manager"
    url: https://www.npmjs.com/package/@aws-sdk/client-secrets-manager
    install: npm install @aws-sdk/client-secrets-manager
    official: true
    verified_status: 200
  - language: python
    registry: pypi
    name: boto3
    url: https://pypi.org/project/boto3/
    install: pip install boto3
    official: true
    verified_status: 200
    note: The Secrets Manager client is accessed via boto3.client('secretsmanager').
  - language: python
    registry: pypi
    name: botocore
    url: https://pypi.org/project/botocore/
    install: pip install botocore
    official: true
    verified_status: 200
