naftiko: "1.0.0-alpha1"

info:
  label: "Amazon Secrets Manager Secrets Management"
  description: "Unified capability for managing application secrets lifecycle including creation, retrieval, rotation, and deletion. Used by DevOps Engineers and Application Developers."
  tags:
    - Amazon Secrets Manager
    - Security
    - Secrets
    - DevOps
    - Credentials
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
      AWS_REGION: AWS_REGION

capability:
  consumes:
    - import: amazon-secrets-manager
      location: ./shared/amazon-secrets-manager.yaml

  exposes:
    - type: rest
      port: 8080
      namespace: secrets-management-api
      description: "Unified REST API for Amazon Secrets Manager secrets lifecycle management."
      resources:
        - path: /v1/secrets
          name: secrets
          description: "Secret lifecycle management"
          operations:
            - method: GET
              name: list-secrets
              description: "List all managed secrets"
              call: "amazon-secrets-manager.list-secrets"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-secret
              description: "Create and store a new secret"
              call: "amazon-secrets-manager.create-secret"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/secrets/{name}
          name: secret
          description: "Individual secret management"
          operations:
            - method: GET
              name: describe-secret
              description: "Get metadata for a secret"
              call: "amazon-secrets-manager.describe-secret"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/secrets/{name}/value
          name: secret-value
          description: "Secret value retrieval and update"
          operations:
            - method: GET
              name: get-secret-value
              description: "Retrieve the current value of a secret"
              call: "amazon-secrets-manager.get-secret-value"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: PUT
              name: put-secret-value
              description: "Update the value of a secret"
              call: "amazon-secrets-manager.put-secret-value"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/secrets/{name}/rotate
          name: secret-rotation
          description: "Secret rotation management"
          operations:
            - method: POST
              name: rotate-secret
              description: "Trigger rotation for a secret"
              call: "amazon-secrets-manager.rotate-secret"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/passwords/random
          name: random-password
          description: "Random password generation"
          operations:
            - method: POST
              name: get-random-password
              description: "Generate a cryptographically secure random password"
              call: "amazon-secrets-manager.get-random-password"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9090
      namespace: secrets-management-mcp
      transport: http
      description: "MCP server for AI-assisted Amazon Secrets Manager secrets lifecycle management."
      tools:
        - name: list-secrets
          description: "List all secrets stored in Amazon Secrets Manager"
          hints:
            readOnly: true
            idempotent: true
          call: "amazon-secrets-manager.list-secrets"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-secret
          description: "Create a new secret in Amazon Secrets Manager"
          hints:
            readOnly: false
            idempotent: false
          call: "amazon-secrets-manager.create-secret"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-secret-value
          description: "Retrieve the plaintext value of a secret"
          hints:
            readOnly: true
            idempotent: true
          call: "amazon-secrets-manager.get-secret-value"
          outputParameters:
            - type: object
              mapping: "$."
        - name: put-secret-value
          description: "Update the value stored in a secret"
          hints:
            readOnly: false
            idempotent: false
          call: "amazon-secrets-manager.put-secret-value"
          outputParameters:
            - type: object
              mapping: "$."
        - name: describe-secret
          description: "Get metadata and configuration details of a secret"
          hints:
            readOnly: true
            idempotent: true
          call: "amazon-secrets-manager.describe-secret"
          outputParameters:
            - type: object
              mapping: "$."
        - name: rotate-secret
          description: "Trigger automatic rotation for a secret"
          hints:
            readOnly: false
            idempotent: false
          call: "amazon-secrets-manager.rotate-secret"
          outputParameters:
            - type: object
              mapping: "$."
        - name: delete-secret
          description: "Schedule a secret for deletion"
          hints:
            readOnly: false
            destructive: true
            idempotent: true
          call: "amazon-secrets-manager.delete-secret"
          outputParameters:
            - type: object
              mapping: "$."
        - name: restore-secret
          description: "Cancel scheduled deletion and restore a secret"
          hints:
            readOnly: false
            idempotent: true
          call: "amazon-secrets-manager.restore-secret"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-random-password
          description: "Generate a cryptographically secure random password"
          hints:
            readOnly: false
            idempotent: false
          call: "amazon-secrets-manager.get-random-password"
          outputParameters:
            - type: object
              mapping: "$."
