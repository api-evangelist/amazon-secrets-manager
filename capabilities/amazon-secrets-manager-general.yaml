naftiko: 1.0.0-alpha2
info:
  label: Amazon Secrets Manager API
  description: 'Amazon Secrets Manager API. 2 operations. Lead operation: Amazon Secrets Manager Tag Resource. Self-contained
    Naftiko capability covering one Amazon Secrets Manager business surface.'
  tags:
  - Amazon Secrets Manager
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AMAZON_SECRETS_MANAGER_API_KEY: AMAZON_SECRETS_MANAGER_API_KEY
capability:
  consumes:
  - type: http
    namespace: amazon-secrets-manager-general
    baseUri: https://secretsmanager.amazonaws.com
    description: Amazon Secrets Manager API business capability. Self-contained, no shared references.
    resources:
    - name: '#TagResource'
      path: /#TagResource
      operations:
      - name: tagresource
        method: POST
        description: Amazon Secrets Manager Tag Resource
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: X-Amz-Target
          in: header
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: '#UntagResource'
      path: /#UntagResource
      operations:
      - name: untagresource
        method: POST
        description: Amazon Secrets Manager Untag Resource
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: X-Amz-Target
          in: header
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: amazon-secrets-manager-general-rest
    port: 8080
    description: REST adapter for Amazon Secrets Manager API. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/tagresource
      name: tagresource
      description: 'REST surface for #TagResource.'
      operations:
      - method: POST
        name: tagresource
        description: Amazon Secrets Manager Tag Resource
        call: amazon-secrets-manager-general.tagresource
        with:
          X-Amz-Target: rest.X-Amz-Target
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/untagresource
      name: untagresource
      description: 'REST surface for #UntagResource.'
      operations:
      - method: POST
        name: untagresource
        description: Amazon Secrets Manager Untag Resource
        call: amazon-secrets-manager-general.untagresource
        with:
          X-Amz-Target: rest.X-Amz-Target
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: amazon-secrets-manager-general-mcp
    port: 9090
    transport: http
    description: MCP adapter for Amazon Secrets Manager API. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: amazon-secrets-manager-tag-resource
      description: Amazon Secrets Manager Tag Resource
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: amazon-secrets-manager-general.tagresource
      with:
        X-Amz-Target: tools.X-Amz-Target
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: amazon-secrets-manager-untag-resource
      description: Amazon Secrets Manager Untag Resource
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: amazon-secrets-manager-general.untagresource
      with:
        X-Amz-Target: tools.X-Amz-Target
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
