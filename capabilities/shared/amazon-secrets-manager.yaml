naftiko: "1.0.0-alpha1"

info:
  label: "Amazon Secrets Manager API"
  description: "API for managing, retrieving, and rotating secrets including database credentials, API keys, and other sensitive configuration."
  tags:
    - Amazon Secrets Manager
    - Security
    - Credentials
    - Secrets
    - AWS
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
      AWS_REGION: AWS_REGION

capability:
  consumes:
    - type: http
      namespace: amazon-secrets-manager
      baseUri: https://secretsmanager.us-east-1.amazonaws.com
      description: "Amazon Secrets Manager API"
      authentication:
        type: apikey
        key: Authorization
        value: "AWS4-HMAC-SHA256 Credential={{AWS_ACCESS_KEY_ID}}"
        placement: header
      resources:
        - name: secrets
          path: /
          description: "Secret management operations"
          operations:
            - name: create-secret
              method: POST
              description: "Creates a new secret"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-secret-value
              method: POST
              description: "Retrieves the contents of the encrypted fields for a secret"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: put-secret-value
              method: POST
              description: "Creates a new version of a secret with updated value"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-secret
              method: POST
              description: "Modifies the details of a secret"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-secret
              method: POST
              description: "Deletes a secret and all of its versions"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: list-secrets
              method: POST
              description: "Lists the secrets that are stored in the account"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: describe-secret
              method: POST
              description: "Retrieves the details of a secret"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: rotate-secret
              method: POST
              description: "Configures and starts the asynchronous process of rotating this secret"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: restore-secret
              method: POST
              description: "Cancels the scheduled deletion of a secret"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-random-password
              method: POST
              description: "Generates a random password"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: amazon-secrets-manager-rest
      resources:
        - path: /v1/secrets
          name: secrets
          description: "Secret management"
          operations:
            - method: GET
              name: list-secrets
              description: "List all secrets"
              call: "amazon-secrets-manager.list-secrets"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-secret
              description: "Create a new secret"
              call: "amazon-secrets-manager.create-secret"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/secrets/{name}/value
          name: secret-value
          description: "Secret value retrieval"
          operations:
            - method: GET
              name: get-secret-value
              description: "Retrieve the value of a secret"
              call: "amazon-secrets-manager.get-secret-value"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/passwords/random
          name: random-password
          description: "Random password generation"
          operations:
            - method: POST
              name: get-random-password
              description: "Generate a random password"
              call: "amazon-secrets-manager.get-random-password"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: amazon-secrets-manager-mcp
      transport: http
      tools:
        - name: list-secrets
          description: "List all Amazon Secrets Manager secrets"
          hints:
            readOnly: true
            idempotent: true
          call: "amazon-secrets-manager.list-secrets"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-secret
          description: "Create a new secret in Amazon Secrets Manager"
          hints:
            readOnly: false
            idempotent: false
          call: "amazon-secrets-manager.create-secret"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-secret-value
          description: "Retrieve the value of a secret from Amazon Secrets Manager"
          hints:
            readOnly: true
            idempotent: true
          call: "amazon-secrets-manager.get-secret-value"
          outputParameters:
            - type: object
              mapping: "$."
        - name: rotate-secret
          description: "Rotate a secret's value using the configured rotation Lambda"
          hints:
            readOnly: false
            idempotent: false
          call: "amazon-secrets-manager.rotate-secret"
          outputParameters:
            - type: object
              mapping: "$."
        - name: delete-secret
          description: "Delete a secret from Amazon Secrets Manager"
          hints:
            readOnly: false
            destructive: true
            idempotent: true
          call: "amazon-secrets-manager.delete-secret"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-random-password
          description: "Generate a random password using Amazon Secrets Manager"
          hints:
            readOnly: true
            idempotent: false
          call: "amazon-secrets-manager.get-random-password"
          outputParameters:
            - type: object
              mapping: "$."
