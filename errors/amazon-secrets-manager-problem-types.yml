generated: '2026-06-20'
method: searched
format: aws-json-1.1
source: >-
  https://docs.aws.amazon.com/secretsmanager/latest/apireference/CommonErrors.html
  and the per-operation "Errors" sections of the Secrets Manager API reference.
  The OpenAPI in this repo documents only 200 responses, so the error registry is
  captured from the AWS API reference rather than derived from the spec.
envelope:
  description: >-
    Errors are returned over Content-Type application/x-amz-json-1.1 with an
    HTTP 4xx/5xx status. The body carries a "__type" field naming the exception
    (e.g. "ResourceNotFoundException") and a human-readable "message" field.
  fields: [__type, message]
service_errors:
  - type: ResourceNotFoundException
    status: 400
    title: Secrets Manager can't find the resource that you asked for.
    remediation: Verify the SecretId (ARN or name), VersionId/VersionStage, and Region.
  - type: ResourceExistsException
    status: 400
    title: A resource with the ID you requested already exists.
    remediation: Use a unique secret name, or update the existing secret instead of creating it.
  - type: InvalidRequestException
    status: 400
    title: >-
      A parameter value is not valid for the current state of the resource
      (e.g. the secret is scheduled for deletion, or rotation is not configured).
    remediation: Restore or reconfigure the secret before retrying the operation.
  - type: InvalidParameterException
    status: 400
    title: The parameter name or value is invalid.
    remediation: Check the parameter names, types, and allowed value ranges.
  - type: InvalidNextTokenException
    status: 400
    title: The NextToken value is invalid.
    remediation: Restart pagination without NextToken, or reuse the token exactly as returned.
  - type: MalformedPolicyDocumentException
    status: 400
    title: The resource policy has syntax errors.
    remediation: Validate the JSON policy document (ValidateResourcePolicy) before attaching it.
  - type: PreconditionNotMetException
    status: 400
    title: The request failed because it didn't meet the preconditions.
    remediation: Ensure prerequisite configuration (e.g. rotation Lambda, KMS key) is in place.
  - type: PublicPolicyException
    status: 400
    title: The resource policy would allow broad, public access to the secret.
    remediation: Scope principals in the policy, or set BlockPublicPolicy to false only if intended.
  - type: LimitExceededException
    status: 400
    title: The request failed because it would exceed one of the Secrets Manager quotas.
    remediation: Request a quota increase, or delete unused secrets/versions.
  - type: EncryptionFailure
    status: 400
    title: Secrets Manager can't encrypt the protected secret text using the provided KMS key.
    remediation: Verify the KMS key exists, is enabled, and the caller has kms:GenerateDataKey.
  - type: DecryptionFailure
    status: 400
    title: Secrets Manager can't decrypt the protected secret text using the provided KMS key.
    remediation: Verify the KMS key is enabled and the caller has kms:Decrypt.
  - type: InternalServiceError
    status: 500
    title: An error occurred on the server side.
    remediation: Retry with exponential backoff; contact AWS Support if it persists.
common_errors:
  - type: AccessDeniedException
    status: 403
    title: You do not have sufficient access to perform this action.
  - type: IncompleteSignature
    status: 400
    title: The request signature does not conform to AWS standards.
  - type: ThrottlingException
    status: 400
    title: The request was denied due to request throttling.
    remediation: Retry with exponential backoff and jitter.
  - type: ValidationError
    status: 400
    title: The input fails to satisfy the constraints specified by an AWS service.
  - type: ExpiredTokenException
    status: 403
    title: The security token included in the request is expired.
  - type: UnrecognizedClientException
    status: 403
    title: The X.509 certificate or AWS access key ID provided does not exist in our records.
